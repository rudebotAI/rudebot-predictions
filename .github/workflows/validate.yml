name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax / import check
        run: |
          python -m compileall -q .
          PYTHONPATH=. python -c "import main, connectors.kalshi, execution.live, risk_manager"
      - name: Run tests
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short
      - name: Paper-mode safety gate
        run: |
          python - <<'PY'
          import sys, yaml
          from pathlib import Path
          # Check the file that actually ships AND the example.
          for name in ("config.yaml", "config.yaml.example"):
              path = Path(name)
              if not path.exists():
                  print(f"SAFETY: {name} missing"); sys.exit(1)
              cfg = yaml.safe_load(path.read_text()) or {}
              mode = cfg.get("mode", "paper")
              if mode != "paper":
                  print(f"SAFETY BLOCKER: {name} mode={mode!r}, must be 'paper' (set BOT_MODE=live via env)"); sys.exit(1)
              risk = cfg.get("risk", {}) or {}
              if float(risk.get("max_position_usd", 10)) > 50 or float(risk.get("max_daily_loss_usd", 20)) > 100:
                  print(f"SAFETY BLOCKER: {name} caps too high for a committed config"); sys.exit(1)
              print(f"{name}: mode=paper, caps ok")
          PY
