# Live config overrides applied on top of code defaults (env_config.py).
# Every RiskConfig field can be set here; env vars override for secrets and caps.
#
# 2026-09-06 upgrade: aligned with the 6-stage framework
#   Scan -> Research -> Predict -> Risk -> Execute -> Compound
#   edge threshold 0.04 | 1/4-Kelly | 8% max-drawdown breaker | Sharpe tracked
# Trades remain Telegram-gated in live mode.
risk:
  # --- hard caps (explicit; do not rely on code defaults) ---
  max_position_usd: 10
  max_daily_loss_usd: 20
  max_open_positions: 5
  max_consecutive_losses: 3
  cooldown_seconds: 300
  max_event_exposure_usd: 20

  # --- sizing ---
  bankroll_usd: 500          # paper bankroll; live mode reads the Kalshi balance
  kelly_fraction: 0.25
  max_portfolio_pct: 0.05

  # --- edge gates ---
  min_edge_bps: 400          # 0.04 probability edge after fees
  min_ev_threshold: 0.05     # fee-adjusted EV per dollar staked
  max_days_to_resolution: 90

  # --- circuit breaker ---
  max_drawdown_pct: 0.08     # sticky halt; /resume clears it

  # --- live execution guards ---
  max_spread: 0.05
  slippage: 0.01

  # --- exits on marked positions ---
  stop_loss_pct: -0.50
  take_profit_pct: 1.00
